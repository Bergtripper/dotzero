name: Refactor CI

on:
  push:
    branches:
      - refactor/dotzero-v3
      - refactor/dotzero-phase2
      - refactor/dotzero-phase2-5-visual
      - refactor/dotzero-phase3a-design-system
      - fix/dotzero-wordmark-style-audit
      - refactor/dotzero-phase3b-project-system
      - feature/dotzero-typographic-specimen
      - feature/dotzero-hero-v2-typography
      - fix/dotzero-hero-scale-motion
      - feature/universal-type-lab
      - feature/universal-systems
      - feature/type-construction-step1
      - refactor/type-construction-v2
      - refactor/project-portable-architecture
      - feature/type-construction-v3
      - feature/type-construction-step2-shared-system
      - feature/type-construction-system-view
      - feature/type-construction-type-test
      - feature/type-construction-spacing-metrics
      - feature/type-construction-kerning
      - feature/type-construction-glyph-b
      - feature/type-construction-glyph-p
      - feature/type-construction-glyph-q
      - feature/type-construction-glyph-e
      - feature/type-construction-glyph-c
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
